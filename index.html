<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autocondo.lol</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/img/acc.png">
</head>
<body>
    <nav class="nav">
        <img src="/nobg.png" class="logo" alt="autocondo logo">
        <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-elements" id="nav-elements">
            <li><a href="#about">about</a></li>
            <li><a href="#contact">contact</a></li>
            <li><a href="#faq">faq</a></li>
        </ul>
    </nav>

    <script>
        document.querySelector('.hamburger').addEventListener('click', function() {
            this.classList.toggle('open');
            document.querySelector('.nav-elements').classList.toggle('open');
        });

        document.querySelectorAll('.nav-elements a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.hamburger').classList.remove('open');
                document.querySelector('.nav-elements').classList.remove('open');
            });
        });
    </script>
</body>
</html>
